<div>
  <form [formGroup]="todoForm" (ngSubmit)="onSubmit()">
    <input formControlName="taskName" placeholder="Add a task" />
    <button type="submit">Add Task</button>
  </form>

  <h3>Tasks</h3>
  <ul>
    <li *ngFor="let task of tasks$ | async">
      {{ task.name }}
      <button (click)="onComplete(task.id)">Complete</button>
      <button (click)="onDelete(task.id)">Delete</button>
    </li>
  </ul>

  <h3>Documents</h3>
  <ul>
    <li *ngFor="let document of documents">
      <strong>Title:</strong> {{ document.title }}<br />
      <strong>Status:</strong> {{ document.status }}<br />
      <strong>Verification Code:</strong> {{ document.verificationCode }}<br />
      <strong>File Path:</strong> {{ document.filePath }}
    </li>
  </ul>
</div>
